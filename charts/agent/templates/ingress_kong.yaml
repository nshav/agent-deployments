---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Chart.Name }}-ingress
  namespace: {{ include "agent.namespaceName" . }}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: kong
  tls:
  {{- if .Values.agent.downstream_hostname }}
  - hosts:
    - {{ .Values.agent.downstream_hostname }}
    secretName: {{ .Values.agent.downstream_hostname }}-tls
  {{- else }}
  - hosts:
    - {{ .Values.agent.upstream_hostname }}
    secretName: {{ .Values.agent.upstream_hostname }}-tls
  {{- end }}
  rules:
  {{- if .Values.agent.downstream_hostname }}
  - host: {{ .Values.agent.downstream_hostname }}
  {{- else }}
  - host: {{ .Values.agent.upstream_hostname }}
  {{- end }}
    http:
      paths:
      - path: /
        pathType: ImplementationSpecific
        backend:
          service:
            name: {{ .Chart.Name }}-svc
            port:
              number: 80
